<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 가격 비활성화</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .admin-title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-button:hover {
            background: #45a049;
        }

        .submit-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4CAF50;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .help-text {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🍁 메이플랜드 가격 추적기</h1>
            <nav class="nav">
                <a href="/" class="nav-link">메인</a>
                <a href="/admin" class="nav-link active">관리자</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="admin-container">
            <h2 class="admin-title">🔧 가격 비활성화 관리</h2>

            <form id="adminForm">
                <div class="form-group">
                    <label class="form-label" for="itemCode">아이템 코드</label>
                    <input
                        type="text"
                        id="itemCode"
                        name="itemCode"
                        class="form-input"
                        placeholder="예: 2290053"
                        required>
                    <div class="help-text">비활성화할 아이템의 코드를 입력하세요.</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="price">가격</label>
                    <input
                        type="number"
                        id="price"
                        name="price"
                        class="form-input"
                        placeholder="예: 150000"
                        required>
                    <div class="help-text">비활성화할 가격을 입력하세요 (원 단위).</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="date">날짜</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                        class="form-input"
                        required>
                    <div class="help-text">해당 가격이 수집된 날짜를 선택하세요.</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminPassword">관리자 비밀번호</label>
                    <input
                        type="password"
                        id="adminPassword"
                        name="adminPassword"
                        class="form-input"
                        placeholder="관리자 비밀번호"
                        required>
                    <div class="help-text">관리자 비밀번호를 입력하세요.</div>
                </div>

                <button type="submit" class="submit-button">비활성화 처리</button>
            </form>

            <div id="message" class="message"></div>

            <a href="/" class="back-link">← 메인 페이지로 돌아가기</a>
        </div>
    </main>

    <script>
        const form = document.getElementById('adminForm');
        const messageDiv = document.getElementById('message');
        const submitButton = form.querySelector('.submit-button');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // 폼 데이터 수집
            const formData = {
                itemCode: document.getElementById('itemCode').value.trim(),
                price: parseInt(document.getElementById('price').value),
                date: document.getElementById('date').value,
                adminPassword: document.getElementById('adminPassword').value
            };

            // 버튼 비활성화 및 로딩 표시
            submitButton.disabled = true;
            submitButton.textContent = '처리 중...';
            messageDiv.style.display = 'none';

            try {
                const response = await fetch('/api/admin/disable-price', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    // 성공 메시지 표시
                    messageDiv.className = 'message success';
                    messageDiv.textContent = result.message;
                    messageDiv.style.display = 'block';

                    // 선택적 폼 초기화 (가격과 비밀번호만)
                    document.getElementById('price').value = '';
                    document.getElementById('adminPassword').value = '';
                    // 아이템코드와 날짜는 유지하여 연속 작업 편의성 향상
                } else {
                    // 에러 메시지 표시
                    messageDiv.className = 'message error';
                    messageDiv.textContent = result.message;
                    messageDiv.style.display = 'block';
                }
            } catch (error) {
                // 네트워크 에러 등
                messageDiv.className = 'message error';
                messageDiv.textContent = '서버와의 통신 중 오류가 발생했습니다.';
                messageDiv.style.display = 'block';
            } finally {
                // 버튼 다시 활성화
                submitButton.disabled = false;
                submitButton.textContent = '비활성화 처리';
            }
        });

        // 페이지 로드 시 오늘 날짜를 기본값으로 설정
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
        });
    </script>
</body>
</html>
